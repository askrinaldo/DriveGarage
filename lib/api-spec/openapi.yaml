openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Vintage Garage API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vehicles
    description: Vehicle operations
  - name: serviceRecords
    description: Service record operations
  - name: receipts
    description: Receipt operations
  - name: tripLogs
    description: Trip log operations
  - name: clubs
    description: Club operations
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List all vehicles
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleBody"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleBody"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vehicles/{id}/export:
    get:
      operationId: exportVehicleData
      tags: [vehicles]
      summary: Export all vehicle data for new owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Full vehicle export with all history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleExport"
        "404":
          description: Not found

  /vehicles/{vehicleId}/service-records:
    get:
      operationId: listServiceRecords
      tags: [serviceRecords]
      summary: List service records for a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRecord"
    post:
      operationId: createServiceRecord
      tags: [serviceRecords]
      summary: Create a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRecordBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"

  /vehicles/{vehicleId}/service-records/{id}:
    get:
      operationId: getServiceRecord
      tags: [serviceRecords]
      summary: Get a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"
        "404":
          description: Not found
    patch:
      operationId: updateServiceRecord
      tags: [serviceRecords]
      summary: Update a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRecordBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"
        "404":
          description: Not found
    delete:
      operationId: deleteServiceRecord
      tags: [serviceRecords]
      summary: Delete a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vehicles/{vehicleId}/receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List receipts for a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Add a receipt to a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReceiptBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"

  /vehicles/{vehicleId}/receipts/{id}:
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Delete a receipt
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vehicles/{vehicleId}/trip-logs:
    get:
      operationId: listTripLogs
      tags: [tripLogs]
      summary: List trip logs for a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripLog"
    post:
      operationId: createTripLog
      tags: [tripLogs]
      summary: Create a trip log entry
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripLogBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripLog"

  /vehicles/{vehicleId}/trip-logs/{id}:
    get:
      operationId: getTripLog
      tags: [tripLogs]
      summary: Get a trip log
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripLog"
        "404":
          description: Not found
    patch:
      operationId: updateTripLog
      tags: [tripLogs]
      summary: Update a trip log
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripLogBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripLog"
        "404":
          description: Not found
    delete:
      operationId: deleteTripLog
      tags: [tripLogs]
      summary: Delete a trip log
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clubs:
    get:
      operationId: listClubs
      tags: [clubs]
      summary: List all clubs
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Club"
    post:
      operationId: createClub
      tags: [clubs]
      summary: Create a club
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClubBody"
      responses:
        "201":
          description: Created club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"

  /clubs/{id}:
    get:
      operationId: getClub
      tags: [clubs]
      summary: Get a club by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubWithMembers"
        "404":
          description: Not found
    patch:
      operationId: updateClub
      tags: [clubs]
      summary: Update a club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClubBody"
      responses:
        "200":
          description: Updated club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Club"
        "404":
          description: Not found
    delete:
      operationId: deleteClub
      tags: [clubs]
      summary: Delete a club
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /clubs/{clubId}/members:
    get:
      operationId: listClubMembers
      tags: [clubs]
      summary: List members of a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Club members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClubMember"
    post:
      operationId: joinClub
      tags: [clubs]
      summary: Join a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinClubBody"
      responses:
        "201":
          description: Joined club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubMember"
        "409":
          description: Already a member

  /clubs/{clubId}/members/{memberId}:
    patch:
      operationId: updateClubMember
      tags: [clubs]
      summary: Update a club member role
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClubMemberBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubMember"
        "404":
          description: Not found
    delete:
      operationId: leaveClub
      tags: [clubs]
      summary: Leave or remove a member from a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Left/removed

  /clubs/{clubId}/invitations:
    get:
      operationId: listClubInvitations
      tags: [clubs]
      summary: List invitations for a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClubInvitation"
    post:
      operationId: createClubInvitation
      tags: [clubs]
      summary: Create an invitation for a club
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClubInvitationBody"
      responses:
        "201":
          description: Created invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubInvitation"

  /clubs/{clubId}/invitations/{invitationId}:
    delete:
      operationId: revokeClubInvitation
      tags: [clubs]
      summary: Revoke a club invitation
      parameters:
        - name: clubId
          in: path
          required: true
          schema:
            type: integer
        - name: invitationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Revoked

  /clubs/invite/{code}:
    get:
      operationId: getClubInvitation
      tags: [clubs]
      summary: Get invitation details by code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubInvitationPublic"
        "404":
          description: Not found or expired

  /clubs/invite/{code}/accept:
    post:
      operationId: acceptClubInvitation
      tags: [clubs]
      summary: Accept a club invitation
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseInvitationBody"
      responses:
        "200":
          description: Joined club
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubMember"
        "400":
          description: Expired or already used
        "404":
          description: Not found

  /clubs/invite/{code}/decline:
    post:
      operationId: declineClubInvitation
      tags: [clubs]
      summary: Decline a club invitation
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UseInvitationBody"
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent service activity across all vehicles
      responses:
        "200":
          description: Recent service activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Vehicle:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        type:
          type: string
          description: "car or motorcycle"
        registrationNumber:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        mileage:
          type: ["integer", "null"]
        finnUrl:
          type: ["string", "null"]
          description: Link to Finn.no listing
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - make
        - model
        - year
        - type
        - registrationNumber
        - color
        - mileage
        - finnUrl
        - notes
        - imageUrl
        - createdAt
        - updatedAt

    CreateVehicleBody:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        type:
          type: string
        registrationNumber:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        mileage:
          type: ["integer", "null"]
        finnUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
      required:
        - make
        - model
        - year
        - type

    UpdateVehicleBody:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        type:
          type: string
        registrationNumber:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        mileage:
          type: ["integer", "null"]
        finnUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]

    VehicleExport:
      type: object
      properties:
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        serviceRecords:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRecord"
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
        tripLogs:
          type: array
          items:
            $ref: "#/components/schemas/TripLog"
        exportedAt:
          type: string
          format: date-time
        totalServiceCost:
          type: number
        totalTripKm:
          type: number
      required:
        - vehicle
        - serviceRecords
        - receipts
        - tripLogs
        - exportedAt
        - totalServiceCost
        - totalTripKm

    ServiceRecord:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        serviceDate:
          type: string
          format: date-time
        mileageAtService:
          type: ["integer", "null"]
        cost:
          type: ["number", "null"]
        performedBy:
          type: ["string", "null"]
          description: Workshop name or "self"
        category:
          type: string
          description: "oil-change, brakes, tires, engine, electrical, bodywork, other"
        bodyArea:
          type: ["string", "null"]
          description: "Specific area of the vehicle: front-wheel, rear-wheel, engine, exhaust, brakes-front, brakes-rear, suspension-front, suspension-rear, electrical, frame, other"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - vehicleId
        - title
        - description
        - serviceDate
        - mileageAtService
        - cost
        - performedBy
        - category
        - bodyArea
        - createdAt
        - updatedAt

    CreateServiceRecordBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        serviceDate:
          type: string
          format: date-time
        mileageAtService:
          type: ["integer", "null"]
        cost:
          type: ["number", "null"]
        performedBy:
          type: ["string", "null"]
        category:
          type: string
        bodyArea:
          type: ["string", "null"]
      required:
        - title
        - category
        - serviceDate

    UpdateServiceRecordBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        serviceDate:
          type: string
          format: date-time
        mileageAtService:
          type: ["integer", "null"]
        cost:
          type: ["number", "null"]
        performedBy:
          type: ["string", "null"]
        category:
          type: string
        bodyArea:
          type: ["string", "null"]

    Receipt:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        serviceRecordId:
          type: ["integer", "null"]
        title:
          type: string
        amount:
          type: ["number", "null"]
        receiptDate:
          type: string
          format: date-time
        vendor:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
          description: Scanned image of receipt
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - vehicleId
        - serviceRecordId
        - title
        - amount
        - receiptDate
        - vendor
        - fileUrl
        - imageUrl
        - notes
        - createdAt

    CreateReceiptBody:
      type: object
      properties:
        serviceRecordId:
          type: ["integer", "null"]
        title:
          type: string
        amount:
          type: ["number", "null"]
        receiptDate:
          type: string
          format: date-time
        vendor:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - title
        - receiptDate

    TripLog:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        tripDate:
          type: string
          format: date-time
        fromLocation:
          type: string
        toLocation:
          type: string
        distanceKm:
          type: ["number", "null"]
        mileageStart:
          type: ["integer", "null"]
        mileageEnd:
          type: ["integer", "null"]
        fuelUsedLiters:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        weather:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - vehicleId
        - tripDate
        - fromLocation
        - toLocation
        - distanceKm
        - mileageStart
        - mileageEnd
        - fuelUsedLiters
        - notes
        - weather
        - createdAt
        - updatedAt

    CreateTripLogBody:
      type: object
      properties:
        tripDate:
          type: string
          format: date-time
        fromLocation:
          type: string
        toLocation:
          type: string
        distanceKm:
          type: ["number", "null"]
