openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Vintage Garage API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: vehicles
    description: Vehicle operations
  - name: serviceRecords
    description: Service record operations
  - name: receipts
    description: Receipt operations
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List all vehicles
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vehicle"
    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleBody"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"

  /vehicles/{id}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get a vehicle by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    patch:
      operationId: updateVehicle
      tags: [vehicles]
      summary: Update a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleBody"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
        "404":
          description: Not found
    delete:
      operationId: deleteVehicle
      tags: [vehicles]
      summary: Delete a vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vehicles/{vehicleId}/service-records:
    get:
      operationId: listServiceRecords
      tags: [serviceRecords]
      summary: List service records for a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRecord"
    post:
      operationId: createServiceRecord
      tags: [serviceRecords]
      summary: Create a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceRecordBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"

  /vehicles/{vehicleId}/service-records/{id}:
    get:
      operationId: getServiceRecord
      tags: [serviceRecords]
      summary: Get a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"
        "404":
          description: Not found
    patch:
      operationId: updateServiceRecord
      tags: [serviceRecords]
      summary: Update a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceRecordBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRecord"
        "404":
          description: Not found
    delete:
      operationId: deleteServiceRecord
      tags: [serviceRecords]
      summary: Delete a service record
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /vehicles/{vehicleId}/receipts:
    get:
      operationId: listReceipts
      tags: [receipts]
      summary: List receipts for a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Receipt"
    post:
      operationId: createReceipt
      tags: [receipts]
      summary: Add a receipt to a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReceiptBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"

  /vehicles/{vehicleId}/receipts/{id}:
    delete:
      operationId: deleteReceipt
      tags: [receipts]
      summary: Delete a receipt
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent service activity across all vehicles
      responses:
        "200":
          description: Recent service activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Vehicle:
      type: object
      properties:
        id:
          type: integer
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        type:
          type: string
          description: "car or motorcycle"
        registrationNumber:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        mileage:
          type: ["integer", "null"]
        finnUrl:
          type: ["string", "null"]
          description: Link to Finn.no listing
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - make
        - model
        - year
        - type
        - registrationNumber
        - color
        - mileage
        - finnUrl
        - notes
        - imageUrl
        - createdAt
        - updatedAt

    CreateVehicleBody:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        type:
          type: string
        registrationNumber:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        mileage:
          type: ["integer", "null"]
        finnUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
      required:
        - make
        - model
        - year
        - type

    UpdateVehicleBody:
      type: object
      properties:
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        type:
          type: string
        registrationNumber:
          type: ["string", "null"]
        color:
          type: ["string", "null"]
        mileage:
          type: ["integer", "null"]
        finnUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]

    ServiceRecord:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        serviceDate:
          type: string
          format: date-time
        mileageAtService:
          type: ["integer", "null"]
        cost:
          type: ["number", "null"]
        performedBy:
          type: ["string", "null"]
          description: Workshop name or "self"
        category:
          type: string
          description: "oil-change, brakes, tires, engine, electrical, bodywork, other"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - vehicleId
        - title
        - description
        - serviceDate
        - mileageAtService
        - cost
        - performedBy
        - category
        - createdAt
        - updatedAt

    CreateServiceRecordBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        serviceDate:
          type: string
          format: date-time
        mileageAtService:
          type: ["integer", "null"]
        cost:
          type: ["number", "null"]
        performedBy:
          type: ["string", "null"]
        category:
          type: string
      required:
        - title
        - category
        - serviceDate

    UpdateServiceRecordBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        serviceDate:
          type: string
          format: date-time
        mileageAtService:
          type: ["integer", "null"]
        cost:
          type: ["number", "null"]
        performedBy:
          type: ["string", "null"]
        category:
          type: string

    Receipt:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        serviceRecordId:
          type: ["integer", "null"]
        title:
          type: string
        amount:
          type: ["number", "null"]
        receiptDate:
          type: string
          format: date-time
        vendor:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - vehicleId
        - serviceRecordId
        - title
        - amount
        - receiptDate
        - vendor
        - fileUrl
        - notes
        - createdAt

    CreateReceiptBody:
      type: object
      properties:
        serviceRecordId:
          type: ["integer", "null"]
        title:
          type: string
        amount:
          type: ["number", "null"]
        receiptDate:
          type: string
          format: date-time
        vendor:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required:
        - title
        - receiptDate

    DashboardStats:
      type: object
      properties:
        totalVehicles:
          type: integer
        totalServiceRecords:
          type: integer
        totalSpent:
          type: number
        vehiclesWithFinnUrl:
          type: integer
        servicesByCategory:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"
      required:
        - totalVehicles
        - totalServiceRecords
        - totalSpent
        - vehiclesWithFinnUrl
        - servicesByCategory

    CategoryCount:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
        - category
        - count

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        vehicleName:
          type: string
        title:
          type: string
        category:
          type: string
        serviceDate:
          type: string
          format: date-time
        cost:
          type: ["number", "null"]
      required:
        - id
        - vehicleId
        - vehicleName
        - title
        - category
        - serviceDate
        - cost
