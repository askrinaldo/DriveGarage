name: Monthly Billing — Create Vipps Charges

on:
  # Runs on the 1st of every month at 06:00 UTC.
  # Vipps requires `due` to be at least 1 day in the future; the job sets due = today + 2 days.
  schedule:
    - cron: '0 6 1 * *'

  # Allow manual trigger from GitHub Actions UI (useful for testing and emergency runs).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report without creating charges'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  charge:
    name: Run monthly charge job
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger billing job
        id: billing
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"dryRun\": ${DRY_RUN}}" \
            "${{ vars.PRODUCTION_URL }}/api/admin/billing/run-monthly-charges")

          echo "response=$RESPONSE"
          echo "response=$RESPONSE" >> "$GITHUB_OUTPUT"

          # Fail the job if the response does not contain "ok":true
          echo "$RESPONSE" | grep -q '"ok":true' || {
            echo "❌ Billing job did not return ok:true"
            echo "$RESPONSE"
            exit 1
          }

      - name: Print result summary
        if: always()
        run: |
          echo "## Billing job result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.billing.outputs.response }}' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY" 2>/dev/null \
            || echo '${{ steps.billing.outputs.response }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
